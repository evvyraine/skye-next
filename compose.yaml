name: skye-next

services:
  skye:
    build:
      context: .
    image: skye-next:prod
    container_name: skye-next
    env_file:
      - .env
    environment:
      SKYE_DATABASE_PATH: /data/skye.db
      SKYE_WEB_HOST: 0.0.0.0
      SKYE_WEB_PORT: 8080
      SKYE_WEB_FILES_PATH: /data/web
      SKYE_OPS_MEDIA_PATH: /data/ops/media
    ports:
      - "127.0.0.1:18780:8080"
    volumes:
      - skye-data:/data
      # Sandbox control: the bot spawns one Docker container per shell_exec
      # through the host daemon. This grants the bot container control over
      # host Docker (root-equivalent); keep the image minimal and network off
      # unless SKYE_SANDBOX_ALLOW_NETWORK=true.
      - /var/run/docker.sock:/var/run/docker.sock
      - skye-sandbox-work:/sandbox-work
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Host docker group so user skye can drive sandbox containers.
    # Override with DOCKER_GID if the host group id differs (default 989).
    group_add:
      - ${DOCKER_GID:-989}
    security_opt:
      - no-new-privileges:true

  # Streamlit beta frontend, mounted at chat.skye-bot.com/beta.
  # A thin client over the API above; it holds no data and can be restarted
  # freely. See streamlit/README.md.
  skye-beta:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    image: skye-next-beta:prod
    container_name: skye-next-beta
    environment:
      # Server-side API calls stay on the compose network; the browser only
      # ever talks to Caddy.
      SKYE_API_URL: http://skye:8080
      # The login button must hit the public /auth path, never the internal one.
      SKYE_AUTH_URL: /auth/telegram
      # Keep in sync with --server.baseUrlPath below.
      SKYE_BASE_PATH: /beta
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.baseUrlPath=beta
    ports:
      - "127.0.0.1:18781:8501"
    depends_on:
      - skye
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  skye-data:
  skye-sandbox-work:
    name: skye-sandbox-work
