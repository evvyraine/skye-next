name: skye-next

services:
  skye:
    build:
      context: .
    image: skye-next:prod
    container_name: skye-next
    env_file:
      - .env
    environment:
      SKYE_DATABASE_PATH: /data/skye.db
      SKYE_WEB_HOST: 0.0.0.0
      SKYE_WEB_PORT: 8080
      SKYE_WEB_FILES_PATH: /data/web
    ports:
      - "127.0.0.1:18780:8080"
    volumes:
      - skye-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  skye-data:
