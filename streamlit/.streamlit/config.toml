# Skye Streamlit demo theme.
#
# Typography mirrors the marketing site (site/css/site.css): self-hosted Geist
# with real Cyrillic subsets, Geist Mono for code. Colours and the 1.5rem
# button radius are the landing tokens too.

[server]
# Serves files from ./static (fonts) at /app/static/<file>.
enableStaticServing = true
headless = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[ui]
hideTopBar = true

[theme]
base = "light"
primaryColor = "#5e60ce"
backgroundColor = "#fbfbfe"
secondaryBackgroundColor = "#f6f5fa"
textColor = "#121016"
linkColor = "#356fb5"
borderColor = "#e8e6ef"
baseRadius = "0.85rem"
buttonRadius = "1.5rem"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
font = "Geist"
headingFont = "Geist"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"

# Geist Sans, same files the landing page ships. Order matters: the fontFaces
# tables must sit under [theme] before the [theme.light]/[theme.dark] tables.

[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-latin.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-latin-ext.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-cyrillic.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-cyrillic-ext.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F"

[theme.light]
primaryColor = "#5e60ce"
backgroundColor = "#fbfbfe"
secondaryBackgroundColor = "#f6f5fa"
textColor = "#121016"
linkColor = "#356fb5"
borderColor = "#e8e6ef"

[theme.light.sidebar]
backgroundColor = "#f6f5fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#121016"
borderColor = "#e8e6ef"
primaryColor = "#5e60ce"

[theme.dark]
primaryColor = "#6d6fe0"
backgroundColor = "#100f16"
secondaryBackgroundColor = "#18171f"
textColor = "#f5f3fa"
linkColor = "#7eb6ea"
borderColor = "#2a2836"

[theme.dark.sidebar]
backgroundColor = "#18171f"
secondaryBackgroundColor = "#100f16"
textColor = "#f5f3fa"
borderColor = "#2a2836"
primaryColor = "#6d6fe0"
